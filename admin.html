<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Novaa Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--paper:#F7F3EB;--ink:#332C2B;--muted:#6B5F5C;--olive:#788D70;--rose:#D9A0A0;--line:#DDD5C5;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.w{max-width:640px;margin:0 auto}h1{font:400 26px Georgia,serif;margin:0 0 14px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;margin:4px 0 12px}
label{font-size:14px;color:var(--muted)}.chk{display:flex;gap:10px;align-items:center;color:var(--ink);margin-bottom:10px}.chk input{width:auto;margin:0}
button{padding:12px 18px;border:0;border-radius:999px;background:var(--rose);color:var(--ink);font:600 15px inherit;cursor:pointer}
button.g{background:#fff;border:1px solid var(--line)}button.d{background:#fff;border:1px solid #c66;color:#a33}
.card{background:#fff;border-radius:18px;padding:12px;margin-bottom:12px;display:flex;gap:12px;box-shadow:0 4px 14px -8px rgba(0,0,0,.3)}
.card img,.ph{width:84px;height:104px;object-fit:cover;border-radius:12px;background:var(--line);flex:none}
.card .i{flex:1;min-width:0}.card b{display:block}.tag{font-size:12px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.acts button{padding:8px 12px;font-size:13px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#form{background:#fff;border-radius:18px;padding:16px;margin-bottom:16px}.hide{display:none}#msg{color:#a33;min-height:20px}
</style></head><body><div class="w">
<div id="login"><h1>Novaa Admin</h1>
<label>Email</label><input id="em" type="email" autocomplete="username">
<label>Parol</label><input id="pw" type="password" autocomplete="current-password">
<button id="go">Kirish</button><p id="msg"></p></div>
<div id="app" class="hide">
<div class="bar"><h1>Buketlar</h1><div><button id="new">+ Yangi</button> <button class="g" id="out">Chiqish</button></div></div>
<div id="form" class="hide">
<label>Nomi</label><input id="n"><label>Tavsif</label><textarea id="d" rows="2"></textarea>
<label>Narxi (so‘m, faqat raqam)</label><input id="p" type="number" inputmode="numeric">
<label>Rasm</label><input id="f" type="file" accept="image/*"><img id="pv" class="hide" style="width:120px;border-radius:12px;margin-bottom:12px">
<label>Tartib raqami (kichigi birinchi)</label><input id="s" type="number" value="0">
<div class="chk"><input id="ins" type="checkbox" checked><span>Mavjud (o‘chirilsa “Hozir mavjud emas” chiqadi)</span></div>
<div class="chk"><input id="act" type="checkbox" checked><span>Saytda ko‘rinsin</span></div>
<button id="save">Saqlash</button> <button class="g" id="cancel">Bekor</button><p id="fm"></p></div>
<div id="list"></div></div></div>
<script>
var SUPABASE_URL="SHU_YERGA_URL",SUPABASE_KEY="SHU_YERGA_ANON_KEY";
var $=function(i){return document.getElementById(i)},editId=null,cur="",rows=[],sb=null;
try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){$("msg").textContent="Supabase URL/kalit noto‘g‘ri qo‘yilgan yoki internet yo‘q: "+e.message}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function show(a){$("login").classList.toggle("hide",a);$("app").classList.toggle("hide",!a);if(a)load()}
if(sb)sb.auth.getSession().then(function(r){show(!!r.data.session)}).catch(function(e){$("msg").textContent="Ulanishda xato: "+e.message});
$("go").onclick=function(){sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value}).then(function(r){if(r.error)$("msg").textContent="Xato: "+r.error.message;else show(true)})};
$("out").onclick=function(){sb.auth.signOut().then(function(){show(false)})};
function load(){sb.from("bouquets").select("*").order("sort_order").order("id").then(function(r){rows=r.data||[];
$("list").innerHTML=rows.map(function(p){return '<div class="card">'+(p.image_url?'<img src="'+esc(p.image_url)+'">':'<div class="ph"></div>')+'<div class="i"><b>'+esc(p.name)+'</b>'+p.price.toLocaleString("ru-RU")+' so‘m<div class="tag">'+(p.active?"Saytda bor":"Yashirin")+' · '+(p.in_stock?"mavjud":"tugagan")+'</div><div class="acts"><button class="g" onclick="edit('+p.id+')">Tahrirlash</button><button class="g" onclick="tog('+p.id+',\'in_stock\')">'+(p.in_stock?"Tugadi":"Mavjud")+'</button><button class="d" onclick="del('+p.id+')">O‘chirish</button></div></div></div>'}).join("")||"<p>Hali buket yo‘q</p>"})}
function tog(id,k){var p=rows.find(function(x){return x.id==id}),u={};u[k]=!p[k];sb.from("bouquets").update(u).eq("id",id).then(load)}
function del(id){if(!confirm("O‘chirilsinmi?"))return;sb.from("bouquets").delete().eq("id",id).then(load)}
function open_(p){editId=p?p.id:null;cur=p?p.image_url:"";$("n").value=p?p.name:"";$("d").value=p?p.description:"";$("p").value=p?p.price:"";$("s").value=p?p.sort_order:rows.length+1;$("ins").checked=p?p.in_stock:true;$("act").checked=p?p.active:true;$("f").value="";$("pv").src=cur;$("pv").classList.toggle("hide",!cur);$("fm").textContent="";$("form").classList.remove("hide");scrollTo(0,0)}
function edit(id){open_(rows.find(function(x){return x.id==id}))}
$("new").onclick=function(){open_(null)};$("cancel").onclick=function(){$("form").classList.add("hide")};
function shrink(file){return new Promise(function(ok){var im=new Image();im.onload=function(){var s=Math.min(1,1000/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(ok,"image/jpeg",.85)};im.src=URL.createObjectURL(file)})}
$("save").onclick=async function(){
 var name=$("n").value.trim(),price=parseInt($("p").value,10);
 if(!name||isNaN(price)){$("fm").textContent="Nom va narxni to‘ldiring";return}
 $("save").disabled=true;$("fm").textContent="Saqlanmoqda…";var url=cur;
 try{var f=$("f").files[0];
  if(f){var b=await shrink(f),path=Date.now()+".jpg",u=await sb.storage.from("bouquets").upload(path,b,{contentType:"image/jpeg"});if(u.error)throw u.error;url=sb.storage.from("bouquets").getPublicUrl(path).data.publicUrl}
  var row={name:name,description:$("d").value.trim(),price:price,image_url:url,sort_order:parseInt($("s").value,10)||0,in_stock:$("ins").checked,active:$("act").checked};
  var r=editId?await sb.from("bouquets").update(row).eq("id",editId):await sb.from("bouquets").insert(row);if(r.error)throw r.error;
  $("form").classList.add("hide");load()
 }catch(e){$("fm").textContent="Xatolik: "+(e.message||e)}
 $("save").disabled=false};
$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click()});
</script></body></html>
